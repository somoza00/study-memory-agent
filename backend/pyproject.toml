[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-memory-backend"
version = "0.1.0"
description = "Estudo com memória persistente: agente Pydantic AI + Qdrant + embeddings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pydantic-ai>=0.0.19",
  # Alinhado ao servidor do compose (qdrant/qdrant:v1.12.4): o cliente avisa
  # (e o pytest poluía o output) quando o minor do cliente passa o do servidor
  # em mais de 1. Subir o servidor é a alternativa — aí sobe este teto junto.
  "qdrant-client>=1.12,<1.20",
  "openai>=1.55",
  "langfuse>=2.55",
  "python-dotenv>=1.0",
  # Pisos de segurança (--skip-editable no pip-audit): todas estas são deps
  # transitivas (certifi/urllib3 via requests+qdrant-client, PyJWT/mcp via
  # pydantic-ai, setuptools via grpcio-tools) e o resolvedor trazia versões com
  # CVE conhecida — o `pip-audit` acusava 33 advisories. Fixar o piso aqui faz
  # uma instalação nova (CI, imagem Docker) já nascer corrigida, sem esperar
  # que alguma dep de cima suba o próprio requisito. `mcp<2` porque o 2.x é
  # major com quebra de API.
  "certifi>=2026.10.19",
  "pyjwt>=2.15",
  "urllib3>=2.8",
  "setuptools>=84.1",
  "mcp>=1.30.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]
# Provedor de embeddings local (ONNX): sem chave e sem rede depois do primeiro
# download dos pesos. Necessário p/ rodar com provedores de chat sem /embeddings
# (ex.: OpenCode Zen/Go).
local-embeddings = [
  "fastembed>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# Padrão legítimo do FastAPI: Depends()/Query() como default de endpoint.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
strict = true
# numpy (dep. transitiva do qdrant-client, via NDArray em query_points) usa
# PEP 695 (`type X = ...`) nos .pyi a partir da 2.1, sintaxe que mypy só
# aceita com python_version >= 3.12 — mesmo em stub, mesmo com
# follow_imports=skip. O runtime do projeto continua em 3.11 (ver Dockerfile
# e requires-python); isto só afeta as premissas de sintaxe do mypy.
python_version = "3.12"
files = ["app"]

# fastembed é dependência OPCIONAL (extra `local-embeddings`) e importada
# tardiamente; sem o override, o mypy do gate falha por não achá-la instalada.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true
