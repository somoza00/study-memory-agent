name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.python-version }} (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = mínimo declarado em `requires-python`; 3.14 = o que a imagem
        # do compose roda (`backend/Dockerfile`). Antes só o 3.11 era testado:
        # uma dep que quebrasse no 3.14 (ex.: wheel sem suporte ao ABI novo)
        # passava pelo CI e só aparecia no `docker compose up`.
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check app
      - name: Types (mypy)
        run: .venv/bin/mypy app
      - name: Tests
        run: .venv/bin/pytest

  frontend:
    name: Frontend (build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        # package-lock.json commitado (PR #12) → npm ci instala exatamente o
        # lockfile e falha se estiver dessincronizado do package.json.
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  dependency-audit:
    # ruff/mypy/pytest rodam as deps já instaladas e nunca olham CVE conhecida:
    # uma dep vulnerável (inclusive transitiva) passava por todo o pipeline e só
    # aparecia se alguém rodasse `pip-audit` na mão. Os repos irmãos
    # (myown-llm-gateway e evaluation-framework) já têm este job; aqui faltava.
    # Diferente do Trivy (que varre a IMAGEM), o pip-audit olha as deps Python
    # resolvidas — o resultado é acionável na hora (subir o piso no pyproject),
    # então aqui ele quebra o build.
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          # O venv nasce com o pip que o runner traz (24.0 no ubuntu-latest), e
          # o pip-audit audita o PRÓPRIO pip: sem atualizar, o job falhava
          # apontando CVEs do pip do venv, não do projeto.
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: pip-audit
        # --skip-editable: o próprio pacote local (instalado com pip install -e)
        # não existe no PyPI pra ser auditado — sem isso, pip-audit trata o
        # pacote local como falha em vez de simplesmente pular.
        run: .venv/bin/pip install "pip-audit>=2.7.0" && .venv/bin/pip-audit --skip-editable

  compose-config:
    # O código é testado (backend/frontend), as imagens são construídas e as
    # deps auditadas — mas o `docker-compose.yml` em si nunca era validado. Um
    # anchor YAML quebrado, um `depends_on` com condição inválida ou uma
    # interpolação `${VAR}` sem default passava por TODO o pipeline e só
    # aparecia no `docker compose up` do host, derrubando o stack inteiro.
    # O alvo `make config` já existia para isso e não rodava em lugar nenhum do
    # CI (o `make ci` até documentava a ausência).
    name: Compose (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida o docker-compose
        # Sem .env (gitignored): todo valor usado tem default via
        # `${VAR:-default}`, então `config` renderiza exatamente o compose de um
        # clone novo. Falha em interpolação sem default, chave desconhecida e
        # serviço/rede/volume mal referenciado.
        run: docker compose config -q

  docker-build:
    # Os jobs acima testam o código no runner (pip/npm), nunca a IMAGEM: um
    # Dockerfile quebrado (COPY de arquivo renomeado, dependência faltando no
    # pyproject, `[local-embeddings]` sem as libs de sistema do onnxruntime)
    # passava por ruff/mypy/pytest e só aparecia em `docker compose up`, com o
    # serviço fora do ar. O myown-llm-gateway e o evaluation-framework já
    # constroem a imagem a cada push/PR; aqui faltava o job equivalente.
    name: Imagens Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem do backend
        run: docker build -t sma-backend:ci ./backend
      - name: Build imagem do frontend
        run: docker build -t sma-frontend:ci ./frontend