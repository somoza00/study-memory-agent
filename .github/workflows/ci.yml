name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.python-version }} (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = mínimo declarado em `requires-python`; 3.14 = o que a imagem
        # do compose roda (`backend/Dockerfile`). Antes só o 3.11 era testado:
        # uma dep que quebrasse no 3.14 (ex.: wheel sem suporte ao ABI novo)
        # passava pelo CI e só aparecia no `docker compose up`.
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check app
      - name: Types (mypy)
        run: .venv/bin/mypy app
      - name: Tests
        run: .venv/bin/pytest

  frontend:
    name: Frontend (build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        # package-lock.json commitado (PR #12) → npm ci instala exatamente o
        # lockfile e falha se estiver dessincronizado do package.json.
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test